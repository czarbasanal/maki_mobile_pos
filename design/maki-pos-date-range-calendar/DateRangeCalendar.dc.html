<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#f8fafb; --surface-3:#eef1f4;
  --border:#e4e8ed; --border-2:#eef1f4;
  --text:#14171c; --text-2:#69727f; --text-3:#98a1ad;
  --accent:#f2c418; --accent-ink:#1d1a08; --accent-soft:#fdf4d2; --accent-line:#e0b200; --accent-text:#8a6300;
  --neg:#c04b38;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -12px rgba(16,24,40,.10);
}
:root[data-theme="dark"]{
  --bg:#0d0f12; --surface:#15181d; --surface-2:#1a1e24; --surface-3:#222731;
  --border:#252b34; --border-2:#1e232a;
  --text:#eceff3; --text-2:#98a1ad; --text-3:#6a7482;
  --accent:#f2c418; --accent-ink:#1d1a08; --accent-soft:#332a0a; --accent-line:#f0c53a; --accent-text:#f0c53a;
  --neg:#e5806c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -12px rgba(0,0,0,.6);
}
html,body{margin:0;padding:0;background:var(--bg);}
*{box-sizing:border-box;}
a{color:var(--text);text-decoration:none;}
a:hover{color:var(--accent-text);}
</style>
</helmet>

<div style="min-height:100vh;background:var(--bg);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--text);padding:28px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:flex-start;gap:14px;">
    <div style="display:flex;flex-direction:column;gap:4px;">
      <span style="font-size:15px;font-weight:600;letter-spacing:-.2px;">Date range filter</span>
      <span style="font-size:12.5px;color:var(--text-3);">One calendar. First click sets From, second sets To.</span>
    </div>
    <button onClick="{{ toggleTheme }}" style="all:unset;cursor:pointer;margin-left:auto;display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:12.5px;color:var(--text-2);" style-hover="color:var(--text);">
      {{ themeIcon }} {{ themeLabel }}
    </button>
  </div>

  <div style="position:relative;width:fit-content;" ref="{{ calRef }}">
    <div style="display:flex;gap:4px;padding:3px;border-radius:11px;background:var(--surface-3);width:fit-content;">
      <sc-for list="{{ ranges }}" as="rg" hint-placeholder-count="5">
        <button onClick="{{ rg.pick }}" style="all:unset;cursor:pointer;padding:6px 13px;border-radius:8px;font-size:12px;white-space:nowrap;font-weight:{{ rg.fw }};background:{{ rg.bg }};color:{{ rg.fg }};">{{ rg.label }}</button>
      </sc-for>
    </div>

    <sc-if value="{{ calOpen }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;top:calc(100% + 8px);left:0;z-index:50;width:296px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:0 20px 48px -16px rgba(0,0,0,.32);display:flex;flex-direction:column;gap:12px;">

        <div style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;">
            <span style="font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-3);font-weight:600;">From</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:{{ fromFg }};">{{ fromLabel }}</span>
          </div>
          <span style="color:var(--text-3);font-size:13px;">–</span>
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;">
            <span style="font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-3);font-weight:600;">To</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:{{ toFg }};">{{ toLabel }}</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:8px;">
          <button onClick="{{ prevMonth }}" title="Previous month" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;color:var(--text-2);flex:0 0 26px;" style-hover="background:var(--surface-3);color:var(--text);">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9"><polyline points="12,4.5 6.5,10 12,15.5"></polyline></svg>
          </button>
          <span style="flex:1;text-align:center;font-size:12.5px;font-weight:600;letter-spacing:-.1px;">{{ monthLabel }}</span>
          <button onClick="{{ nextMonth }}" title="Next month" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;color:var(--text-2);flex:0 0 26px;" style-hover="background:var(--surface-3);color:var(--text);">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9"><polyline points="8,4.5 13.5,10 8,15.5"></polyline></svg>
          </button>
        </div>

        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">
          <sc-for list="{{ dowLabels }}" as="d" hint-placeholder-count="7">
            <span style="text-align:center;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:2px 0 4px 0;">{{ d.label }}</span>
          </sc-for>
          <sc-for list="{{ days }}" as="c" hint-placeholder-count="42">
            <button onClick="{{ c.pick }}" onMouseEnter="{{ c.hover }}" style="all:unset;cursor:{{ c.cursor }};height:32px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:{{ c.fw }};background:{{ c.bg }};color:{{ c.fg }};border-radius:{{ c.radius }};">{{ c.label }}</button>
          </sc-for>
        </div>

        <div style="display:flex;align-items:center;gap:8px;padding-top:11px;border-top:1px solid var(--border-2);">
          <span style="font-size:11px;color:var(--text-3);">{{ calHint }}</span>
          <button onClick="{{ clearRange }}" style="all:unset;cursor:pointer;margin-left:auto;font-size:11.5px;color:var(--text-3);" style-hover="color:var(--neg);">Reset</button>
          <button onClick="{{ applyRange }}" style="all:unset;cursor:pointer;padding:7px 13px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;opacity:{{ applyOpacity }};">Apply</button>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="margin-top:auto;padding:12px 15px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);width:fit-content;display:flex;align-items:center;gap:12px;">
    <span style="font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-3);font-weight:600;">Applied</span>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;">{{ appliedLabel }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:620}}">
const DOW = ['S','M','T','W','T','F','S'];
const pad = (n) => (n < 10 ? '0' + n : '' + n);
const keyOf = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);

class Component extends DCLogic {
  state = {
    theme:'light', range:'Custom', calOpen:true,
    calMonth:{y:2026, m:8}, from:null, to:null, hover:null, applied:null
  };

  calRef = React.createRef();

  componentDidMount(){
    let t = 'light';
    try { t = localStorage.getItem('maki-pos-theme') || 'light'; } catch(e) {}
    document.documentElement.setAttribute('data-theme', t);
    this.setState({theme:t});

    this._down = (e) => {
      if(!this.state.calOpen) return;
      const el = this.calRef.current;
      if(el && !el.contains(e.target)) this.setState({calOpen:false, hover:null});
    };
    this._key = (e) => {
      if(e.key === 'Escape' && this.state.calOpen) this.setState({calOpen:false, hover:null});
    };
    document.addEventListener('mousedown', this._down, true);
    document.addEventListener('keydown', this._key, true);
  }

  componentWillUnmount(){
    document.removeEventListener('mousedown', this._down, true);
    document.removeEventListener('keydown', this._key, true);
  }

  setTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('maki-pos-theme', t); } catch(e) {}
    this.setState({theme:t});
  }

  // one calendar, two clicks: first sets From, second sets To.
  // a second click before the first reverses the pair instead of failing.
  pickDay(key){
    return () => {
      const st = this.state;
      if(!st.from || (st.from && st.to)) this.setState({from:key, to:null, hover:null});
      else if(key < st.from) this.setState({from:key, to:st.from, hover:null});
      else this.setState({to:key, hover:null});
    };
  }

  fmt(key){
    if(!key) return null;
    const p = key.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  }

  renderVals(){
    const st = this.state;
    const cal = st.calMonth;
    const today = keyOf(2026, 8, 3);

    const firstDow = new Date(cal.y, cal.m, 1).getDay();
    const daysInMonth = new Date(cal.y, cal.m + 1, 0).getDate();
    const prevDays = new Date(cal.y, cal.m, 0).getDate();

    // hover previews the range while only From is set
    const end = st.to || st.hover;
    const lo = st.from && end ? (end < st.from ? end : st.from) : null;
    const hi = st.from && end ? (end < st.from ? st.from : end) : null;

    const cells = [];
    for(let i = 0; i < 42; i++){
      const n = i - firstDow + 1;
      const inMonth = n >= 1 && n <= daysInMonth;
      let y = cal.y, m = cal.m, d = n;
      if(n < 1){ m = cal.m - 1; d = prevDays + n; if(m < 0){ m = 11; y = cal.y - 1; } }
      else if(n > daysInMonth){ m = cal.m + 1; d = n - daysInMonth; if(m > 11){ m = 0; y = cal.y + 1; } }
      const key = keyOf(y, m, d);

      const inRange = lo && hi && key > lo && key < hi;
      const isEdge = key === st.from || key === st.to || (st.from && !st.to && key === st.hover);

      let bg = 'transparent', fg = inMonth ? 'var(--text-2)' : 'var(--text-3)', fw = '400', radius = '8px';
      if(inRange){ bg = 'var(--accent-soft)'; fg = 'var(--accent-text)'; fw = '500'; radius = '0'; }
      if(isEdge){
        bg = 'var(--accent)'; fg = 'var(--accent-ink)'; fw = '600';
        if(lo && hi && lo !== hi) radius = key === lo ? '8px 0 0 8px' : (key === hi ? '0 8px 8px 0' : '0');
      }
      if(!isEdge && !inRange && key === today){ fg = 'var(--accent-text)'; fw = '600'; }

      cells.push({
        label:d, key:key, bg:bg, fg:fg, fw:fw, radius:radius,
        cursor: inMonth ? 'pointer' : 'default',
        pick: inMonth ? this.pickDay(key) : () => {},
        hover: (inMonth && st.from && !st.to) ? () => this.setState({hover:key}) : () => {}
      });
    }

    return {
      themeLabel: st.theme === 'light' ? 'Dark' : 'Light',
      themeIcon: st.theme === 'light' ? '☾' : '☀',
      toggleTheme: () => this.setTheme(st.theme === 'light' ? 'dark' : 'light'),

      ranges: ['Today','7 days','30 days','Custom'].map(r => {
        const on = st.range === r;
        return {
          label:r,
          bg: on ? 'var(--surface)' : 'transparent',
          fg: on ? 'var(--text)' : 'var(--text-2)',
          fw: on ? '600' : '500',
          pick: () => r === 'Custom'
            ? this.setState(s => ({range:'Custom', calOpen: !s.calOpen}))
            : this.setState({range:r, calOpen:false, applied:r})
        };
      }),

      calRef: this.calRef,
      calOpen: st.calOpen,
      monthLabel: new Date(cal.y, cal.m, 1).toLocaleDateString('en-US', {month:'long', year:'numeric'}),
      prevMonth: () => this.setState({calMonth: cal.m === 0 ? {y:cal.y - 1, m:11} : {y:cal.y, m:cal.m - 1}}),
      nextMonth: () => this.setState({calMonth: cal.m === 11 ? {y:cal.y + 1, m:0} : {y:cal.y, m:cal.m + 1}}),
      dowLabels: DOW.map((d, i) => ({label:d, key:i})),
      days: cells,

      fromLabel: this.fmt(st.from) || 'Pick a date',
      fromFg: st.from ? 'var(--text)' : 'var(--text-3)',
      toLabel: this.fmt(st.to) || (st.from ? 'Pick a date' : '—'),
      toFg: st.to ? 'var(--text)' : 'var(--text-3)',
      calHint: !st.from ? 'Click a day to start' : (!st.to ? 'Click a second day to end' : 'Range set'),
      applyOpacity: (st.from && st.to) ? '1' : '.45',

      clearRange: () => this.setState({from:null, to:null, hover:null}),
      applyRange: () => {
        if(!st.from || !st.to) return;
        this.setState({calOpen:false, hover:null, applied: this.fmt(st.from) + ' – ' + this.fmt(st.to)});
      },
      appliedLabel: st.applied || 'No range applied'
    };
  }
}
</script>
</body>
</html>
